name: Integration contracts
on:
  push:
    paths:
      - 'integrations/**'
      - 'tests/**'
      - '.github/workflows/integrations-ci.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - 'tests/**'
      - '.github/workflows/integrations-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test provider integration contracts offline
        run: node --test tests/*.test.mjs
